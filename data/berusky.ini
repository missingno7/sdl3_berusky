# Configuration for berusky game
#
# This file is created in your user data directory on the first start
# (Windows: %APPDATA%\Anakreon\Berusky, Linux: ~/.local/share/Anakreon/Berusky,
# macOS: ~/Library/Application Support/Anakreon/Berusky, Android: app storage)
# and it's the one the game reads and writes.

# ---------------------------------------------------------------------------
# Graphics
# ---------------------------------------------------------------------------
# The game renders in a fixed resolution (640x480, or 1280x900 in double-size
# mode) and it's scaled to the window keeping its aspect ratio.

# fullscreen = 1 - borderless fullscreen at the desktop resolution
fullscreen = 0

# Initial window size as a multiple of the game resolution
# window_scale = 1

# How the game picture is scaled to the window:
#   integer  - only whole multiples (1x, 2x, 3x...) - crisp pixels, black borders
#   fit      - fills the window keeping the aspect ratio, nearest neighbour
#   smooth   - fills the window keeping the aspect ratio, smoothed
# (default: integer on desktop, fit on phones and tablets)
# scale_mode = integer

# Wait for the vertical sync when presenting the picture
# vsync = yes

# On-screen touch controls while playing: yes | no | auto (auto = phones and tablets)
# touch_controls = auto

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log = 0
# logfile = /path/to/berusky.log

# ---------------------------------------------------------------------------
# Locations (optional)
# ---------------------------------------------------------------------------
# By default the game finds its data (Graphics, GameData, Levels) next to the
# executable, and stores the user data (profiles, user levels) in the user
# data directory. Uncomment to override.
#
# level_data = /usr/share/berusky/Levels
# game_data = /usr/share/berusky/GameData
# graphics_data = /usr/share/berusky/Graphics
# level_data_user = ~/berusky-levels
#
# Editor: "run level" starts this executable and stores the level in tmp_data
# game_binary = /usr/bin/berusky
# tmp_data = /var/tmp
