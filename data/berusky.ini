# Configuration for berusky game
#
# This file is created in your user data directory on the first start
# (Windows: %APPDATA%\Anakreon\Berusky, Linux: ~/.local/share/Anakreon/Berusky,
# macOS: ~/Library/Application Support/Anakreon/Berusky, Android: app storage)
# and it's the one the game reads and writes.

# ---------------------------------------------------------------------------
# Graphics
# ---------------------------------------------------------------------------
# The game is laid out in a 640x480 composition (logical units, one level
# cell = 20 units) and it's RENDERED at the resolution of the window or the
# screen: 1x artwork is scaled once from its own pixels, the 2x artwork is
# used as it is. The picture keeps its aspect ratio (black bars on wide
# screens). F12 shows the renderer's diagnostics overlay.

# fullscreen = 1 - borderless fullscreen at the desktop resolution
fullscreen = 0

# Initial window size as a multiple of the composition (auto = the biggest
# that fits the desktop)
# window_scale = auto

# How the composition is fitted into the window:
#   fit      - as big as possible (default)
#   integer  - whole multiples only (2x, 3x...), bigger black borders
# presentation = fit

# How low resolution artwork is scaled to the render resolution:
#   nearest  - hard pixels
#   linear   - smooth
#   pixelart - sharp pixels with smooth edges at any scale (default)
#   scale2x  - edge smoothing pixel-art enlarger (EPX / AdvMAME)
#   legacy2x - the enlarger of the old "high resolution" mode
#   xbrz     - reserved, not built in yet (uses pixelart)
# asset_scaler = pixelart

# Resolution of the rendered scene:
#   native   - the window's own resolution (default)
#   integer  - a whole multiple of 640x480, then filtered to the window
#   <number> - a fixed scale, e.g. 1 = classic 640x480
# render_resolution = native

# Filter of the rendered scene when it isn't shown 1:1 (render_resolution
# integer or a number): nearest | linear | pixelart
# presentation_filter = pixelart

# Photo backgrounds behind the menus: photo | black (the original look)
# menu_background = photo

# Directory with HD replacements of the artwork (name@2x.png, name@4x.png...)
# hd_pack = /path/to/hd-pack

# Wait for the vertical sync when presenting the picture
# vsync = yes

# The old keys disable_double_size, startup_doublesize_question and
# scale_mode are no longer needed (scale_mode is still understood when the
# keys above are missing).

# On-screen touch controls while playing: yes | no | auto (auto = phones and tablets)
# touch_controls = auto

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log = 0
# logfile = /path/to/berusky.log

# ---------------------------------------------------------------------------
# Locations (optional)
# ---------------------------------------------------------------------------
# By default the game finds its data (Graphics, GameData, Levels) next to the
# executable, and stores the user data (profiles, user levels) in the user
# data directory. Uncomment to override.
#
# level_data = /usr/share/berusky/Levels
# game_data = /usr/share/berusky/GameData
# graphics_data = /usr/share/berusky/Graphics
# level_data_user = ~/berusky-levels
#
# Editor: "run level" starts this executable and stores the level in tmp_data
# game_binary = /usr/bin/berusky
# tmp_data = /var/tmp
